# ClipForge configuration. Anything not set here uses the defaults in clipforge/config.py.
# Put machine-specific overrides (e.g. storage on another drive) in config.local.yaml.

storage_dir: storage            # e.g. D:/ClipForge/Storage on Windows
retention_days: 14              # source VOD video/audio deleted after this (clips + transcripts kept)

download:
  max_height: 1080

transcription:
  model: small.en               # try medium.en later if accuracy matters more than speed
  device: cpu
  compute_type: int8
  cpu_threads: 6                # Core Ultra 7 155H: leaves headroom for Windows + rendering
  mode: auto                    # auto | full | hotspots
  hotspot_after_minutes: 90     # VODs longer than this only transcribe the most active regions
  hotspot_count: 40
  hotspot_seconds: 120

render:
  encoder: auto                 # auto picks Intel Quick Sync (h264_qsv) when it works, else libx264
  width: 1080
  height: 1920
  fps: 30

llm:
  enabled: false                # set true after `ollama pull qwen2.5:3b-instruct`
  model: qwen2.5:3b-instruct
  top_n: 15
  weight: 0.5

discovery:
  enabled: true
  interval_hours: 3
  max_per_channel: 3

niches:
  gaming:
    name: Gaming highlights
    crop: blur
    clips_per_source: 10
  podcast:
    name: Podcast moments
    crop: center
    clips_per_source: 8
  irl:
    name: Internet culture / IRL
    crop: center
    clips_per_source: 10
